name: CI

# Modelo de confianza:
#   - Workflow-level permissions = contents:read (default deny).
#   - Cada job eleva permisos solo si los necesita.
#   - persist-credentials:false en checkout para que un step posterior
#     no pueda re-usar el GITHUB_TOKEN del checkout para escribir.
#   - Acciones third-party pinned a SHA (commit hash) — un tag movible
#     puede ser repunteado a un commit malicioso sin que el repo se entere.
#   - Auditoría adicional en .github/workflows/security.yml y
#     .github/workflows/workflow-security.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo build release
        run: cargo build --release --bin gabysql --bin gabysql-server
      - name: Stage release binaries
        # Copying to a dedicated folder gives upload-artifact a single
        # root path. That avoids the noisy 'Multiple search paths
        # detected. Calculating the least common ancestor...' line that
        # the action prints when it receives two paths, and lets us drop
        # the OS-conditional split (one step instead of two).
        shell: bash
        run: |
          mkdir -p artifact-staging
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/gabysql.exe        artifact-staging/
            cp target/release/gabysql-server.exe artifact-staging/
          else
            cp target/release/gabysql        artifact-staging/
            cp target/release/gabysql-server artifact-staging/
          fi
      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gabysql-${{ runner.os }}-release
          path: artifact-staging
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Docker build
        run: docker build -t gabysql .

  bench:
    # Bloque M2 (2026-06-11): gabybench smoke (microblog + orders_lines)
    # en CI. ~1-2 min vs 10-15 min del modo `all`. Sube bench/results.json
    # como artifact por commit — sirve para tracking manual de regresiones
    # hasta que tengamos baseline persistido (M2-futuro).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Build gabybench (release)
        run: cargo build --release --bin gabybench
      - name: Run gabybench smoke
        run: ./target/release/gabybench smoke
      - name: Upload bench results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gabybench-smoke-results
          path: bench/results.json
          if-no-files-found: error

  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: '8.2'
      - name: Lint landing
        run: php -l web/index.php
      - name: Lint admin
        run: php -l web/phpgabyadmin/index.php
