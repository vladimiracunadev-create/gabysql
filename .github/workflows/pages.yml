name: Pages

# Builda y publica el sitio Jekyll desde `docs/` a GitHub Pages.
# Se dispara con:
#   - push a `main` que toque docs/ o el propio workflow.
#   - tag `v*` (alinear el sitio con cada release).
#   - workflow_dispatch (botón "Run workflow" en la pestaña Actions).
#
# Modelo de confianza (consistente con ci.yml y release.yml):
#   - Workflow-level permissions = contents:read (default deny).
#   - El job `deploy` eleva permisos solo a `pages:write` + `id-token:write`
#     (lo que requiere actions/deploy-pages para autenticarse via OIDC,
#     sin necesidad de PAT ni token persistido).
#   - Third-party actions pinned a SHA.
#   - persist-credentials:false en el checkout.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'CHANGELOG.md'      # para que el sidebar de "novedades" se refresque
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions

# Solo una build de Pages a la vez. Si llegan dos pushes en flight,
# encolamos la última y descartamos la del medio para no bloquear el
# pipeline.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Excepción al pin-to-SHA del repo: las acciones oficiales
      # `actions/*-pages*` se referencian por tag mayor (`@v5`, `@v1`,
      # `@v3`) porque son del propio org de GitHub y no de un third-party.
      # Mantener SHAs invenntados rompió el workflow en el primer intento
      # (commit 0d93e31 → run 26423829070); el tag mayor garantiza que
      # GitHub resuelva al último release minor estable.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # ver nota en job `build` sobre @v* en acciones oficiales
