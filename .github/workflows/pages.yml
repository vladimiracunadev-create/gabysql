name: Pages

# Builda y publica el sitio Jekyll desde `docs/` a GitHub Pages.
# Se dispara con:
#   - push a `main` que toque docs/ o el propio workflow.
#   - tag `v*` (alinear el sitio con cada release).
#   - workflow_dispatch (botón "Run workflow" en la pestaña Actions).
#
# Modelo de confianza (consistente con ci.yml y release.yml):
#   - Workflow-level permissions = contents:read (default deny).
#   - El job `deploy` eleva permisos solo a `pages:write` + `id-token:write`
#     (lo que requiere actions/deploy-pages para autenticarse via OIDC,
#     sin necesidad de PAT ni token persistido).
#   - Third-party actions pinned a SHA.
#   - persist-credentials:false en el checkout.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'CHANGELOG.md'      # para que el sidebar de "novedades" se refresque
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions

# Solo una build de Pages a la vez. Si llegan dos pushes en flight,
# encolamos la última y descartamos la del medio para no bloquear el
# pipeline.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # SHAs reales de los últimos releases (resueltos vía gh api).
      # Política del repo (workflow-security.yml) exige pin a SHA en
      # TODAS las third-party actions, incluso las oficiales `actions/*`.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
