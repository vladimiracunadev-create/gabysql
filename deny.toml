# cargo-deny configuration.
#
# Hoy gabysql no declara dependencias externas en Cargo.toml: el grafo es
# vacío. Esta config queda como guardrail para cuando se agreguen crates,
# para que la primera dependencia con licencia incompatible o vulnerabilidad
# conocida levante una bandera en CI en vez de pasar inadvertida.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allowlist conservador. Cualquier licencia fuera de esta lista debe ser
# aprobada explícitamente y documentada en SECURITY.md antes de añadirla.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
